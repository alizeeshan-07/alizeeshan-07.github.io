# -- Theme Options -- https://blowfish.page/docs/configuration/
colorScheme = "noir"
defaultAppearance = "dark"      # light or dark
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

disableImageOptimization = false

# -- Logo --
# Path is relative to assets/. Blowfish inlines SVG logos, so the mark can
# inherit the theme's text colour via fill="currentColor".
Logo = "img/ali-zeeshan-script.svg"
disableTextInHeader = true


# Image used for link previews (og:image / twitter:image) when a page has none.
# Path is relative to assets/.
defaultSocialImage = "img/author.jpg"

[header]
  layout = "fixed"              # basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile"            # this gives the centered photo + name + links look
  showRecent = false
  showRecentItems = 0
  showMoreLink = false

[article]
  showDate = false
  showAuthor = false
  showReadingTime = false
  showWordCount = false         # theme default is true; "1876 words" under each title
  showTableOfContents = true
  showPagination = false
  showRelatedContent = false
  showComments = false
