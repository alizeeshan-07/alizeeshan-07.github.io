<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="Ali Zeeshan">
  <!--
    Urdu wordmark: علی ذیشان — Reem Kufi 700, per ali-zeeshan-logo/README.txt
    ("modern geometric Kufic, flat baseline, monoline — NOT Nastaliq").

    Three things the supplied SVGs lacked and this restores:
    - font-family: all four exports had an empty <defs> and no font, so they
      rendered in whatever Arabic-script fallback the visitor had.
    - font-size: without it the text drew at the 16px default in a 600x200 box.
    - fill: currentColor, so the mark follows the theme colour set in
      custom.css — brand green on light, white on dark.

    Character note: uses U+06CC (Urdu yeh) not U+064A (Arabic yeh); the
    supplied files used the Arabic form in both words.
  -->
  <text x="300" y="132"
        text-anchor="middle"
        direction="rtl"
        font-family="'Reem Kufi', sans-serif"
        font-weight="700"
        font-size="104"
        fill="currentColor">علی ذیشان</text>
</svg>
