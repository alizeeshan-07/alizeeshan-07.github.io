# Publication list — the single source of truth for the Publications page.
#
# Bibliographic detail (titles, author order, volume, pages, DOI) is taken from
# Crossref, i.e. the publisher's own deposited record, rather than from a CV or
# a profile page. Where they disagreed, Crossref won.
#
# To add a paper: append an entry below. That is the whole change.
#   group    accepted | inprogress | thesis | earlier  (which heading it renders under)
#   sortkey  YYYYMM as an integer — sorts within a group, newest first
#   date     display string, e.g. "September 2025". Omit it and nothing renders.
#   status   optional chip, e.g. "Under revision". Used by the inprogress group.
#   links    optional list of {name, url}
#
# DOIs: only the four published papers have one. Crossref and arXiv were both
# queried by title for every manuscript in the inprogress group on 14 Oct 2026
# and none is indexed anywhere, which is expected — they are not out yet. Add
# the DOI to an entry at the moment it is assigned, not before.

