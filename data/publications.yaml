# Publication list — the single source of truth for the Publications page.
#
# RULE: a paper appears here ONLY once it is accepted or posted to arXiv.
# Never before. In-progress manuscripts stay out.
#
# Bibliographic detail (titles, author order, volume, pages, DOI) is taken from
# Crossref, i.e. the publisher's own deposited record, rather than from a CV or
# a profile page. Where they disagreed, Crossref won.
#
# To add a paper: append an entry below. That is the whole change.
#   group    accepted | thesis | earlier   (which heading it renders under)
#   sortkey  YYYYMM as an integer — sorts within a group, newest first
#   date     display string, e.g. "September 2025"
#   links    optional list of {name, url}

