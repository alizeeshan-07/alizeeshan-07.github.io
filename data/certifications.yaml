# Certifications — the single source of truth for the Certifications section.
#
# Two groups, because only some issuers publish verifiable badge artwork:
#
#   badged  Credly-issued. Credly hosts the official artwork AND a public
#           verification page, so these render as full badges.
#   listed  No badge artwork exists, so these render as a compact line with
#           the issuer's logo mark. Still linked to a real verification page.
#
# Titles, issuers and dates come from each issuer's own verification page where
# one exists, not from the CV or LinkedIn, since the issuer is authoritative.
#
#   badge  path under assets/ — official artwork, downloaded from Credly rather
#          than hotlinked so it renders even if their CDN is slow
#   logo   path under assets/ — issuer logo mark, inlined so it follows the
#          text colour in both light and dark mode. Optional.
#   url    the verification page. Every entry must have one; a certification
#          nobody can check is not worth listing.

