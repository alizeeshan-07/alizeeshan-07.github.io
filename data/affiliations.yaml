# Current and past affiliations — the logo row on the About page.
#
# Current affiliations first, then reverse chronological, so the row reads as a
# trajectory rather than an unordered pile.
#
#   name   the organisation, used as the image alt text
#   label  what shows on hover — the relationship, not just the name again
#   logo   path under assets/. SVG is served as-is; rasters go through Hugo's
#          resize. Logos keep their native aspect ratio and share a common
#          height, so a wide wordmark and a square crest carry equal weight.
#
#   invert  optional: "light" or "dark" — the theme in which this mark needs its
#           luminance flipped to stay visible. Only ever set on a MONOCHROME
#           mark; inverting a coloured logo shifts its hue and misrepresents the
#           brand. Measured saturation before setting it: Six Atomic 0, UET 2,
#           versus 74-161 for the NATO, ZONG and Adept Tech marks, which are
#           therefore left alone in both themes.
#
# Not listed, for want of a usable logo: AI Workforce, NeuralStacks, Imperium
# Solutions, and Huzhou University. Adding one is a single entry here.

- name: "National University of Sciences and Technology"
  label: "SEECS, NUST — PhD & MSc (current)"
  logo: "img/affiliations/nust.svg"

- name: "Adept Tech Solutions"
  label: "Adept Tech Solutions — Head of AI (current)"
  logo: "img/affiliations/adept-tech.png"

- name: "NATO Science for Peace and Security"
  label: "NATO SPS — project SHAILLA (current)"
  logo: "img/affiliations/nato.png"

- name: "Six Atomic"
  label: "Six Atomic, Singapore — Sr. Algorithm Engineer"
  logo: "img/affiliations/six-atomic.png"
  # Pure white mark (luminance 255), designed for a dark background.
  invert: "light"

- name: "ZONG CMPak"
  label: "ZONG CMPak — Core Networks, seven years"
  logo: "img/affiliations/zong.png"

- name: "University of Engineering and Technology, Lahore"
  label: "UET Lahore — BSc Electrical Engineering"
  logo: "img/affiliations/uet-lahore.png"
  # Near-black monochrome crest (luminance 109, saturation 2).
  invert: "dark"
