# IEEE memberships — the logo row and text list under Professional memberships.
#
# Split deliberately:
#
#   societies    Paid IEEE Society memberships. These get logos, because they
#                are substantive: you join and pay per society.
#   communities  IEEE Technical Communities and Technical Committees. Free to
#                join for any IEEE member, so they are listed as text. Giving
#                each one a logo would put eleven more marks on the page and
#                imply they carry the same weight as a society membership.
#
# Ordered by relevance to the published work rather than alphabetically —
# ComSoc first, since IEEE Communications Magazine and IEEE OJCOMS are both
# ComSoc publications.
#
#   invert  the theme in which to flip this mark, matching data/affiliations.yaml.
#           Omit it when the mark already reads on both backgrounds.
#
# These marks used to sit on per-logo plaques, which left eight boxes floating
# on the page. They now sit directly on the background like the affiliation
# logos, and the ones that would otherwise disappear are flipped per theme.
#
# The filter is invert(1) hue-rotate(180deg), not a plain invert: these marks
# are not all monochrome, and inverting a coloured one alone would land it on
# the complementary hue. The second step rotates the hue back. Measured over
# every opaque pixel of each mark, as a share with less than 1.6:1 contrast
# against the page background it sits on:
#
#   mark               fails before   after    median hue before -> after
#   ComSoc                100% light     0%    monochrome (pure white, sat 0)
#   SPS                   100% light     0%    monochrome (pure white, sat 0)
#   Computer Society     53.8% light     0%    37 deg -> 28 deg
#   ITSoc                  100% dark     0%    monochrome (pure black, sat 0)
#   CIS                      38% dark     0%   195 deg -> 196 deg
#   VTS                      23% dark     0%   203 deg -> 203 deg
#
# IEEE and AESS carry no flag: measured 0% and 1.7%, so both already read on
# either background and are left exactly as published.
#
# Note for anyone revisiting this: SPS was previously assumed to carry a radial
# gradient that ruled inversion out. It does not — measured saturation is 0
# across every pixel, so it flips to solid black cleanly.

societies:
  - name: "IEEE"
    label: "IEEE — Student Member"
    logo: "img/memberships/ieee.svg"

  - name: "IEEE Communications Society"
    label: "IEEE Communications Society (ComSoc)"
    logo: "img/memberships/comsoc.svg"
    invert: "light"

  - name: "IEEE Vehicular Technology Society"
    label: "IEEE Vehicular Technology Society (VTS)"
    logo: "img/memberships/vts.svg"
    invert: "dark"

  - name: "IEEE Signal Processing Society"
    label: "IEEE Signal Processing Society (SPS)"
    logo: "img/memberships/sps.svg"
    invert: "light"

  - name: "IEEE Information Theory Society"
    label: "IEEE Information Theory Society (ITSoc)"
    logo: "img/memberships/itsoc.svg"
    invert: "dark"

  - name: "IEEE Aerospace and Electronic Systems Society"
    label: "IEEE Aerospace and Electronic Systems Society (AESS)"
    logo: "img/memberships/aess.svg"

  - name: "IEEE Computer Society"
    label: "IEEE Computer Society"
    logo: "img/memberships/computer-society.png"
    invert: "light"

  - name: "IEEE Computational Intelligence Society"
    label: "IEEE Computational Intelligence Society (CIS)"
    logo: "img/memberships/cis.png"
    invert: "dark"

communities:
  - "Future Networks"
  - "Internet of Things"
  - "Digital Reality"
  - "Public Safety Technology"
  - "Entrepreneurship"
  - "Computer Society: High Performance Computing"
  - "Computer Society: Intelligent Informatics"
  - "Computer Society: Quantum"
  - "Computer Society: Digital Privacy Task Force"
  - "Robotics & Automation Society: Machine Learning for Automation"
  - "Engineering in Medicine & Biology Society: Neural & Rehabilitation Engineering"
